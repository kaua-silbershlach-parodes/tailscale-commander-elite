[package]
name = "tailscale-commander-elite"
version = "1.2.2"
description = "Tailscale Commander Elite desktop base (Rust/Tauri + system WebView) with signed GitHub auto-updates and a separate Elixir backend slot, by A Elite Estrangeira."
edition = "2021"

[lib]
name = "tailscale_commander_elite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1" # required by tauri::generate_context!
log = "0.4"
tauri-plugin-log = "2"

[target.'cfg(target_os = "windows")'.dependencies]
getrandom = "=0.4.3"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Linux GTK3 compatibility: upstream PR gtk-rs/gtk-rs-core#1343,
# backported to the registry-authenticated glib 0.18.5 source.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"
