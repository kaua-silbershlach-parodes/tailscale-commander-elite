[package]
name = "tailscale-commander-elite"
version = "1.2.2"
description = "Tailscale Commander Elite desktop base (Rust/Tauri + system WebView) with signed GitHub auto-updates and a separate Elixir backend slot, by A Elite Estrangeira."
edition = "2021"
# Distribution is through authorized signed GitHub releases, not a crate registry.
publish = false
repository = "https://github.com/kaua-silbershlach-parodes/tailscale-commander-elite"
license-file = "../LICENSE"

[lib]
name = "tailscale_commander_elite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1" # required by tauri::generate_context!
log = "0.4"
tauri-plugin-log = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Linux GTK3 compatibility: upstream PR gtk-rs/gtk-rs-core#1343,
# backported to the registry-authenticated glib 0.18.5 source.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"
